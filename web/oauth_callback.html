<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth 回调处理</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ff6b6b;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>正在处理登录...</h2>
        <p>请稍候，窗口将自动关闭</p>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        (function() {
            try {
                // 获取URL参数
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const error = urlParams.get('error');
                const state = urlParams.get('state');

                if (error) {
                    // OAuth错误处理
                    const errorDescription = urlParams.get('error_description') || error;
                    document.getElementById('error').textContent = `登录失败: ${errorDescription}`;
                    document.getElementById('error').style.display = 'block';
                    
                    // 通知父窗口错误
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'oauth_error',
                            error: error,
                            error_description: errorDescription
                        }, '*');
                    }
                    
                    // 3秒后关闭窗口
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                    return;
                }

                if (code) {
                    // 成功获取授权码
                    const callbackUrl = window.location.href;
                    
                    // 通知父窗口成功获取授权码
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'oauth_success',
                            code: code,
                            state: state,
                            callback_url: callbackUrl
                        }, '*');
                    }
                    
                    // 立即关闭窗口
                    window.close();
                } else {
                    // 没有找到授权码
                    document.getElementById('error').textContent = '未找到授权码，请重试';
                    document.getElementById('error').style.display = 'block';
                    
                    // 通知父窗口错误
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'oauth_error',
                            error: 'no_code',
                            error_description: '未找到授权码'
                        }, '*');
                    }
                    
                    // 3秒后关闭窗口
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                }
            } catch (e) {
                console.error('OAuth回调处理错误:', e);
                document.getElementById('error').textContent = `处理错误: ${e.message}`;
                document.getElementById('error').style.display = 'block';
                
                // 通知父窗口错误
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'oauth_error',
                        error: 'callback_error',
                        error_description: e.message
                    }, '*');
                }
                
                // 3秒后关闭窗口
                setTimeout(() => {
                    window.close();
                }, 3000);
            }
        })();
    </script>
</body>
</html>
