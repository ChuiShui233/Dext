<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OAuth 回调处理</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h3>正在处理登录...</h3>
        <p>请稍候，窗口即将关闭</p>
    </div>

    <script>
        (function() {
            try {
                // 获取当前URL的查询参数
                const urlParams = new URLSearchParams(window.location.search);
                const currentUrl = window.location.href;
                
                // 检查是否有授权码或错误信息
                if (urlParams.has('code') || urlParams.has('error')) {
                    // 向父窗口发送消息
                    if (window.opener) {
                        window.opener.postMessage(currentUrl, '*');
                    }
                    
                    // 延迟关闭窗口，让用户看到处理状态
                    setTimeout(() => {
                        window.close();
                    }, 1000);
                } else {
                    // 如果没有预期的参数，显示错误并关闭
                    document.querySelector('h3').textContent = '登录失败';
                    document.querySelector('p').textContent = '未收到有效的授权信息';
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                }
            } catch (error) {
                console.error('OAuth callback error:', error);
                // 发生错误时也尝试关闭窗口
                setTimeout(() => {
                    window.close();
                }, 2000);
            }
        })();
    </script>
</body>
</html>
