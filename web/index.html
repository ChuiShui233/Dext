<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dext，创造更好的问卷">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dext">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dext</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #app-loader.slide-up {
      opacity: 0;
      pointer-events: none;
    }

    .loader-content {
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    .loader-img {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.65));
    }

    .loader-text {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .loader-letter {
      display: inline-block;
      opacity: 0.3;
      animation: letterAnim 1.6s infinite;
      transform: translateY(0);
    }

    .loader-letter:nth-child(1) { animation-delay: 0s; }
    .loader-letter:nth-child(2) { animation-delay: 0.1s; }
    .loader-letter:nth-child(3) { animation-delay: 0.2s; }
    .loader-letter:nth-child(4) { animation-delay: 0.3s; }
    .loader-letter:nth-child(5) { animation-delay: 0.4s; }
    .loader-letter:nth-child(6) { animation-delay: 0.5s; }
    .loader-letter:nth-child(7) { animation-delay: 0.6s; }

    @keyframes letterAnim {
      0%, 100% {
        opacity: 0.2;
        transform: translateY(0);
        filter: blur(2px);
      }
      30% {
        opacity: 1;
        transform: translateY(-4px) scale(1.2);
        filter: blur(0px);
      }
      60% {
        opacity: 0.5;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loader { transition: opacity 0.3s ease !important; }
      .loader-content { animation: none !important; }
    }

    @media (max-width: 768px) {
      .loader-img { width: 100px; height: 100px; }
      .loader-text { font-size: 14px; }
    }
  </style>
</head>

<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div class="loader-content">

      <img class="loader-img" src="assets/assets/images/loading.gif" alt="loading" />

      <div class="loader-text">
        <span class="loader-letter">L</span>
        <span class="loader-letter">O</span>
        <span class="loader-letter">A</span>
        <span class="loader-letter">D</span>
        <span class="loader-letter">I</span>
        <span class="loader-letter">N</span>
        <span class="loader-letter">G</span>
      </div>

    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    if (window.dartAppRunner) {
      window.addEventListener('load', function () {
        if (!crossOriginIsolated) {
          SharedArrayBuffer = undefined;
        }
        window.dartAppRunner.runner.dispatch({
          command: "set-settings",
          args: {
            "enableBackgroundIsolate": true
          }
        });
      });
    }
  </script>

  <script>
    (function () {
      var loader = document.getElementById('app-loader');

      function hideLoader() {
        if (!loader) return;
        loader.classList.add('slide-up');
        setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
          loader = null;
        }, 450);
      }

      window.addEventListener('flutter-first-frame', hideLoader);
      setTimeout(hideLoader, 20000);
    })();
  </script>
</body>
</html>
