<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dext">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dext</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --slide-duration: 480ms;
      --slide-curve: cubic-bezier(0.22, 1, 0.36, 1); /* 柔和且有力度的出场曲线 */
      --fade-duration: 300ms;
    }
    /* 页面加载阶段的覆盖层与动画 */
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      z-index: 9999;
      transition: transform var(--slide-duration) var(--slide-curve), opacity var(--fade-duration) ease;
      will-change: transform, opacity;
    }
    #app-loader.fade-out { opacity: 0; pointer-events: none; }
    #app-loader.slide-up { transform: translateY(-100%); opacity: 0; pointer-events: none; }
    #app-loader .loader-content { text-align: center; color: #8a9299; font-family: inherit; }
    #app-loader .loader-img { width: 45vmin; height: 45vmin; object-fit: contain; display: block; margin: 0 auto 16px; }
    /* 全局字体优先使用苹方 */
    body {
      font-family: 'PingFang SC', 'PingFang', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 无障碍：用户偏好减少动画时，仅做淡出 */
    @media (prefers-reduced-motion: reduce) {
      #app-loader { transition: opacity var(--fade-duration) ease !important; }
      #app-loader.slide-up { transform: none; opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div class="loader-content">
      <img class="loader-img" src="assets/images/loading.gif" alt="loading" />
      <div>正在加载资源，等等哦~</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if (window.dartAppRunner) {
      window.addEventListener('load', function () {
        // 启用多线程支持
        if (!crossOriginIsolated) {
          SharedArrayBuffer = undefined;
        }
        window.dartAppRunner.runner.dispatch({
          command: "set-settings",
          args: {
            "enableBackgroundIsolate": true
          }
        });
      });
    }
  </script>
  <script>
    // 在 Flutter 首帧渲染后隐藏加载动画；增加超时兜底
    (function () {
      var loader = document.getElementById('app-loader');
      function hideLoader() {
        if (!loader) return;
        // 上滑退出动画
        loader.classList.add('slide-up');
        // 动画结束后移除节点
        setTimeout(function () {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          loader = null;
        }, 450);
      }

      // Flutter Web 会在首帧绘制时触发该事件
      window.addEventListener('flutter-first-frame', hideLoader);

      // 如果因为异常未触发事件，超时自动隐藏，避免卡住
      setTimeout(hideLoader, 20000);
    })();
  </script>
</body>
</html>
