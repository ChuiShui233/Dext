<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dext，创造更好的问卷">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dext">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dext</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #app-loader.slide-up {
      opacity: 0;
      pointer-events: none;
    }

    .loader-content {
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    .loader-img {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
    }

    .loader-content > div {
      color: rgba(255, 255, 255, 0.95);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loader { transition: opacity 0.3s ease !important; }
      .loader-content { animation: none !important; }
    }

    @media (max-width: 768px) {
      .loader-img { width: 100px; height: 100px; }
      .loader-content > div { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div class="loader-content">
      <img class="loader-img" src="assets/assets/images/loading.gif" alt="loading" />
      <div>正在加载资源，等等哦</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if (window.dartAppRunner) {
      window.addEventListener('load', function () {
        // 启用多线程支持
        if (!crossOriginIsolated) {
          SharedArrayBuffer = undefined;
        }
        window.dartAppRunner.runner.dispatch({
          command: "set-settings",
          args: {
            "enableBackgroundIsolate": true
          }
        });
      });
    }
  </script>
  <script>
    // 在 Flutter 首帧渲染后隐藏加载动画；增加超时兜底
    (function () {
      var loader = document.getElementById('app-loader');
      function hideLoader() {
        if (!loader) return;
        // 上滑退出动画
        loader.classList.add('slide-up');
        // 动画结束后移除节点
        setTimeout(function () {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          loader = null;
        }, 450);
      }

      window.addEventListener('flutter-first-frame', hideLoader);
      setTimeout(hideLoader, 20000);
    })();
  </script>
</body>
</html>
