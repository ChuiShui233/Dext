name: Flutter Multi-Platform Build Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Android 构建测试
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: 获取依赖
        run: flutter pub get

      - name: 分析代码
        run: flutter analyze --no-fatal-infos

      - name: 运行测试
        run: flutter test || echo "No tests found"

      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # iOS 构建测试
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 iOS (无签名)
        run: flutter build ios --release --no-codesign

      - name: 上传 iOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 7

  # Windows 构建测试
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: 启用 Windows 桌面支持
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: 获取依赖
        run: flutter pub get

      - name: 确保 Windows 平台存在
        run: |
          if (!(Test-Path "windows")) {
            Write-Host "Windows 目录不存在，正在创建..."
            flutter create --platforms=windows .
          }

      - name: 构建 Windows
        run: flutter build windows --release

      - name: 打包 Windows 应用
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dext-windows.zip

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dext-windows.zip
          retention-days: 7

  # macOS 构建测试
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: 启用 macOS 桌面支持
        run: |
          flutter config --enable-macos-desktop
          flutter doctor -v

      - name: 获取依赖
        run: flutter pub get

      - name: 确保 macOS 平台存在
        run: |
          if [ ! -d "macos" ]; then
            echo "macOS 目录不存在，正在创建..."
            flutter create --platforms=macos .
          fi

      - name: 构建 macOS
        run: flutter build macos --release

      - name: 打包 macOS 应用
        run: |
          cd build/macos/Build/Products/Release
          zip -r dext-macos.zip dext.app

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/dext-macos.zip
          retention-days: 7

  # Linux 构建测试
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjson-glib-dev \
            libsecret-1-0 \
            libsecret-1-dev \
            libjsoncpp-dev

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: 启用 Linux 桌面支持
        run: |
          flutter config --enable-linux-desktop
          flutter doctor -v

      - name: 获取依赖
        run: flutter pub get

      - name: 确保 Linux 平台存在
        run: |
          if [ ! -d "linux" ]; then
            echo "Linux 目录不存在，正在创建..."
            flutter create --platforms=linux .
          fi

      - name: 构建 Linux
        run: flutter build linux --release

      - name: 打包 Linux 应用
        run: |
          cd build/linux/x64/release/bundle
          tar -czf dext-linux.tar.gz *

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/dext-linux.tar.gz
          retention-days: 7

  # Web 构建测试
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Web
        run: flutter build web --release

      - name: 上传 Web 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  # 构建总结
  build-summary:
    needs: [build-android, build-ios, build-windows, build-macos, build-linux, build-web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 构建结果总结
        run: |
          echo "## 构建测试结果 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.build-ios.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.build-windows.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.build-macos.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | ${{ needs.build-linux.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | ${{ needs.build-web.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
